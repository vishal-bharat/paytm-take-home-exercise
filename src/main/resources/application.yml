spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${DB_USER:seats}
    password: ${DB_PASSWORD:seats}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
      connection-timeout: 30000   
  flyway:
    enabled: true

server:
  shutdown: graceful
  tomcat:
    max-connections: 20000     
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db  

logging:
  structured:
    format:
      console: logstash